"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Use the Catppuccin Mocha palette so named colors (base, mauve, …) resolve.
# Matches the Ghostty theme.
palette = 'catppuccin_mocha'

format = """\
  $os\
  $directory\
  $kubernetes\
  $python\
  $git_branch\
  $git_commit\
  $git_state\
  $git_status\
  \n$character\

  """

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red)'

[os]
disabled = false
format = '[$symbol](bold white)'

[os.symbols]
Fedora = " "
Linux = " "
Macos = " "
Windows = "󰍲 "

[cmd_duration]
min_time = 500

[directory]
truncation_length = 8
truncation_symbol = '…/'
read_only = " "
style = 'bold blue'
read_only_style = 'bold red'
format = ' [$path]($style)[$read_only]($read_only_style) '

[directory.substitutions]
"chezmoi" = " 󱏖 "
"Code" = "  "
"Desktop" = " 󰇄 "
"Documents" = " 󰈙 "
"Dropbox" = " 󰇣 "
"Downloads" = "  "
"Movies" = "  "
"Music" = "  "
"Pictures" = "  "

[kubernetes]
disabled = false
symbol = "󱃾 "
format = "[\\[$symbol$context \\($namespace\\)\\]]($style) "
style  = "bold bright-green"

[python]
disabled = false
format = '\[[${symbol}${pyenv_prefix}(${version})]($style)\] '
symbol = " "

[golang]
format = '[[  go ](fg:base bg:mauve)]($style)'

[git_branch]
symbol = " "
format = 'via [$symbol$branch]($style) '
style = 'bold green'

[git_status]
format = '([$all_status$ahead_behind]($style)) '
style = 'dimmed green'
modified = '[󰛿 ${count}M](yellow) '
staged = '[󰐗 ${count}S](green) '
deleted = '[󰍶 ${count}D](red) '

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[git_commit]
disabled = false
commit_hash_length = 8
only_detached = false
style = "grey"
tag_symbol = " "
