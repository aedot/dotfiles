# tmux — managed by chezmoi (~/.config/tmux/tmux.conf)
# Self-contained: no plugin manager, no external dependencies.

# --- General ------------------------------------------------------------
set  -g  default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set  -g  mouse on
set  -g  history-limit 50000
set  -sg escape-time 10            # no lag on <Esc> (matters in nvim)
set  -g  focus-events on
set  -g  set-clipboard on

# --- Keybindings --------------------------------------------------------
setw -g mode-keys vi
# Reload config in place.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
# Splits that inherit the current directory; more intuitive keys.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# vim-style visual selection + yank in copy mode.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status bar ---------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=black,bg=blue,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=cyan]%a %d %b #[fg=white]%H:%M "
set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[fg=black,bg=cyan,bold] #I:#W "
set -g pane-border-style        "fg=brightblack"
set -g pane-active-border-style "fg=blue"
